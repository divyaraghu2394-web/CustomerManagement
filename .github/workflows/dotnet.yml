
name: CustomerManagement CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore CustomerManagement.slnx

      - name: Build solution
        run: dotnet build CustomerManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CustomerManagement.slnx --configuration Release --no-build

      - name: Publish Customer API
        run: dotnet publish CustomerManagement.API/CustomerManagement.API.csproj --configuration Release --no-build -o ./publish/customer-api

      - name: Publish Order API
        run: dotnet publish OrderManagement.API/OrderManagement.API.csproj --configuration Release --no-build -o ./publish/order-api

      - name: Publish Blazor Web
        run: dotnet publish CustomerManagement.Web/CustomerManagement.Web.csproj --configuration Release --no-build -o ./publish/customer-web

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CustomerManagement-Deployment
          path: ./publish/
          retention-days: 7

