
name: CustomerManagement CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore CustomerManagement.sln

      - name: Build solution
        run: dotnet build CustomerManagement.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CustomerManagement.sln --configuration Release --no-build
